<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ranger Dashboard - VanaRaksha AI</title>
    <link rel="stylesheet" href="/src/styles.css" />
    <link href="https://unpkg.com/maplibre-gl@4.1.3/dist/maplibre-gl.css" rel="stylesheet" />
    <script src="https://unpkg.com/maplibre-gl@4.1.3/dist/maplibre-gl.js"></script>

    <style>
        .dashboard-container {
            display: grid;
            grid-template-columns: var(--sidebar-w) 1fr 300px;
            flex: 1;
            height: calc(100vh - var(--header-h));
            position: relative;
        }

        .sidebar, .escalation-panel {
            background: var(--bg-surface);
            border-right: 1px solid var(--glass-border);
            display: flex;
            flex-direction: column;
            z-index: 5;
            overflow-y: auto;
        }

        .escalation-panel {
            border-right: none;
            border-left: 1px solid var(--glass-border);
            padding: 16px;
            display: none; /* hidden by default until a confirmed fire is selected */
        }
        
        .escalation-panel.visible {
            display: flex;
        }

        .sidebar-header, .panel-header {
            padding: 16px;
            border-bottom: 1px solid var(--glass-border);
            background: var(--bg-card);
        }

        .sidebar-header h2, .panel-header h2 {
            font-family: var(--font-display);
            font-size: 18px;
            font-weight: 700;
            color: #20332a;
            margin-bottom: 4px;
        }

        .alert-list {
            flex: 1;
            padding: 12px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .alert-card {
            background: var(--bg-card);
            border: 1px solid var(--glass-border);
            border-radius: var(--border-radius);
            padding: 14px;
            cursor: pointer;
            transition: all var(--transition);
        }

        .alert-card:hover {
            border-color: rgba(61,204,115,0.3);
            background: var(--bg-card-hover);
            transform: translateY(-2px);
        }

        .alert-card.active {
            background: #dfe8d8;
            border-color: var(--green-400);
            box-shadow: 0 4px 12px rgba(61,204,115,0.15);
        }

        .alert-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
        }

        .alert-time { font-size: 10px; color: rgba(36, 52, 44, 0.5); font-weight: 500; }
        .alert-coords { font-size: 12px; color: #6d6a61; margin-bottom: 12px; line-height: 1.4; }
        .alert-coords strong { color: #20332a; }

        .btn-view-map {
            width: 100%;
            background: rgba(61,204,115,0.1);
            border: 1px solid rgba(61,204,115,0.25);
            color: var(--green-700);
            font-family: var(--font-primary);
            font-size: 12px;
            font-weight: 600;
            padding: 8px;
            border-radius: var(--border-radius-sm);
            cursor: pointer;
            transition: all var(--transition);
        }
        .alert-card:hover .btn-view-map { background: rgba(61,204,115,0.2); }

        .map-area { position: relative; background: #e4dfd2; }
        #map { width: 100%; height: 100%; }

        .action-panel {
            position: absolute;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            background: var(--glass-bg);
            backdrop-filter: var(--glass-blur);
            padding: 16px;
            border-radius: 12px;
            box-shadow: 0 8px 32px rgba(24, 61, 43, 0.15);
            border: 1px solid var(--glass-border);
            display: none;
            gap: 10px;
            z-index: 1000;
        }
        .action-panel.visible { display: flex; flex-wrap: wrap; justify-content: center; max-width: 90%; }

        .btn-action {
            font-family: var(--font-primary);
            padding: 10px 16px;
            font-weight: 600;
            font-size: 13px;
            border-radius: var(--border-radius-sm);
            cursor: pointer;
            transition: all var(--transition);
        }

        .btn-confirm { background: linear-gradient(135deg, var(--red-600), var(--red-500)); color: white; border: 1px solid #9f4035; }
        .btn-false { background: var(--bg-card); color: var(--green-800); border: 1px solid var(--glass-border); }
        .btn-simulate { background: linear-gradient(135deg, var(--blue-400), #2563eb); color: white; border: 1px solid #1d4ed8; width: 100%; margin-bottom: 8px; }
        .btn-contained { background: linear-gradient(135deg, var(--green-600), var(--green-500)); color: white; border: 1px solid var(--green-700); }

        .empty-state { padding: 40px 20px; text-align: center; color: #7b6f60; }
        .empty-state svg { color: rgba(61,204,115,0.4); margin-bottom: 12px; }

        .toast-container { position: fixed; top: 20px; right: 20px; z-index: 9999; display: flex; flex-direction: column; gap: 10px; }
        .toast { background: var(--glass-bg); backdrop-filter: var(--glass-blur); color: #20332a; padding: 12px 20px; border-radius: var(--border-radius); border-left: 4px solid var(--green-500); border: 1px solid var(--glass-border); max-width: 350px; font-size: 13px; font-weight: 500; }
        .toast.error { border-left-color: var(--red-500); }
        .toast.success { border-left-color: var(--green-400); }
        
        .loading-overlay { position: absolute; inset: 0; background: rgba(235, 229, 217, 0.7); backdrop-filter: blur(2px); display: flex; justify-content: center; align-items: center; z-index: 50; font-family: var(--font-display); font-weight: 700; font-size: 18px; color: var(--green-800); display: none; }
        
        /* Escalation Log Styles */
        .log-entry { font-size: 12px; margin-bottom: 12px; border-left: 2px solid var(--green-400); padding-left: 10px; }
        .log-time { font-size: 10px; color: #7b6f60; }
        .log-level { font-weight: bold; color: var(--red-600); }
        .status-badge { font-size: 11px; padding: 2px 6px; border-radius: 4px; font-weight: bold; margin-left: 8px; }
        .status-badge.pending { background: rgba(245, 158, 11, 0.2); color: #b45309; }
        .status-badge.confirmed { background: rgba(239, 68, 68, 0.2); color: #b91c1c; }
        .status-badge.resolved { background: rgba(61, 204, 115, 0.2); color: var(--green-800); }
    </style>
</head>
<body>

    <header class="header">
        <div class="logo">
            <span class="logo-icon">VR</span>
            <div class="logo-text">
                <span class="logo-name">VanaRaksha</span>
                <span class="logo-tag">Ranger Verification</span>
            </div>
        </div>
        <div class="header-right">
            <span style="font-size: 12px; color: #7b6f60;" id="user-email-display">Loading...</span>
            <button class="nav-btn" id="logout-btn">Logout</button>
        </div>
    </header>

    <div class="dashboard-container">
        <div class="sidebar">
            <div class="sidebar-header">
                <h2>Active Alerts</h2>
                <div id="zone-display" style="font-size: 11px; color: #7b6f60; text-transform: uppercase; letter-spacing: 0.5px; margin-top: 4px;"></div>
            </div>
            <div id="alert-list" class="alert-list"></div>
        </div>

        <div class="map-area">
            <div id="map"></div>
            
            <div id="action-panel" class="action-panel">
                <!-- Buttons injected via JS based on status -->
            </div>
            
            <div id="map-loading" class="loading-overlay">Updating map...</div>
        </div>
        
        <div class="escalation-panel" id="escalation-panel">
            <div class="panel-header" style="margin: -16px -16px 16px -16px;">
                <h2>Escalation Status</h2>
            </div>
            <div id="escalation-content">
                <!-- Log injected here -->
            </div>
        </div>
    </div>

    <div id="toast-container" class="toast-container"></div>

    <script type="module">
        import { supabase } from './supabaseClient.js';

        const ZONE_BASES = { 'ZONE_NORTH': [78.5678, 30.1234] };

        let currentUser = null;
        let currentRanger = null;
        let alertsData = [];
        let map = null;
        let selectedAlert = null;
        let mapMarkers = [];
        let routeSourceAdded = false;

        const alertListEl = document.getElementById('alert-list');
        const userEmailDisplay = document.getElementById('user-email-display');
        const zoneDisplay = document.getElementById('zone-display');
        const logoutBtn = document.getElementById('logout-btn');
        const actionPanel = document.getElementById('action-panel');
        const mapLoading = document.getElementById('map-loading');
        const escalationPanel = document.getElementById('escalation-panel');
        const escalationContent = document.getElementById('escalation-content');

        function showToast(message, type = 'info') {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            toast.className = `toast ${type}`;
            toast.textContent = message;
            container.appendChild(toast);
            setTimeout(() => { toast.remove(); }, 5000);
        }

        function formatTime(isoString) {
            const d = new Date(isoString);
            return d.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }) + ' ' + d.toLocaleDateString();
        }

        function initMap() {
            map = new maplibregl.Map({
                container: 'map',
                style: 'https://basemaps.cartocdn.com/gl/positron-gl-style/style.json',
                center: [78.9629, 20.5937],
                zoom: 4
            });
            map.on('load', () => {
                map.addSource('route', { 'type': 'geojson', 'data': { 'type': 'Feature', 'properties': {}, 'geometry': { 'type': 'LineString', 'coordinates': [] } } });
                map.addLayer({ 'id': 'route-line', 'type': 'line', 'source': 'route', 'layout': { 'line-join': 'round', 'line-cap': 'round' }, 'paint': { 'line-color': '#2f6948', 'line-width': 4, 'line-dasharray': [2, 2] } });
                routeSourceAdded = true;
            });
        }

        async function loadAlerts() {
            try {
                const { data, error } = await supabase
                    .from('alerts')
                    .select('*')
                    .eq('zone_id', currentRanger.zone_id)
                    .in('status', ['pending', 'confirmed'])
                    .order('created_at', { ascending: false });

                if (error) throw error;
                alertsData = data;
                
                // If the selected alert was updated, refresh it in the UI
                if (selectedAlert) {
                    const updatedAlert = alertsData.find(a => a.id === selectedAlert.id);
                    if (updatedAlert) {
                        selectedAlert = updatedAlert;
                        updateActionPanel();
                    } else {
                        // Alert was resolved and removed from list
                        selectedAlert = null;
                        actionPanel.classList.remove('visible');
                        escalationPanel.classList.remove('visible');
                    }
                }
                
                renderAlerts();
            } catch (err) {
                console.error(err);
                showToast("Failed to load alerts: " + err.message, "error");
            }
        }

        function renderAlerts() {
            alertListEl.innerHTML = '';
            if (alertsData.length === 0) {
                alertListEl.innerHTML = `<div class="empty-state"><p>No active alerts.</p></div>`;
                return;
            }

            alertsData.forEach(alert => {
                const card = document.createElement('div');
                card.className = 'alert-card';
                if (selectedAlert && selectedAlert.id === alert.id) card.classList.add('active');

                const badgeClass = alert.confidence.includes('Low') ? 'badge-info' : 'badge-warning';
                let statusBadge = '';
                if (alert.status === 'confirmed') statusBadge = '<span class="status-badge confirmed">CONFIRMED</span>';
                else if (alert.status === 'pending') statusBadge = '<span class="status-badge pending">PENDING</span>';
                
                card.innerHTML = `
                    <div class="alert-header">
                        <span class="card-badge ${badgeClass}">${alert.confidence}</span>
                        ${statusBadge}
                    </div>
                    <div class="alert-coords">
                        <strong>Lat:</strong> ${alert.lat.toFixed(5)}<br>
                        <strong>Lng:</strong> ${alert.lng.toFixed(5)}
                    </div>
                    <button class="btn-view-map">View Details</button>
                `;
                card.addEventListener('click', () => selectAlert(alert, card));
                alertListEl.appendChild(card);
            });
        }

        async function selectAlert(alert, cardElement) {
            selectedAlert = alert;
            renderAlerts(); 
            actionPanel.classList.add('visible');
            updateActionPanel();
            
            mapMarkers.forEach(m => m.remove());
            mapMarkers = [];
            const alertLngLat = [alert.lng, alert.lat];
            mapMarkers.push(new maplibregl.Marker({ color: '#b85443' }).setLngLat(alertLngLat).addTo(map));
            map.flyTo({ center: alertLngLat, zoom: 12 });
            
            if (alert.status === 'confirmed') {
                escalationPanel.classList.add('visible');
                loadEscalationLog(alert.id);
            } else {
                escalationPanel.classList.remove('visible');
            }
        }
        
        async function loadEscalationLog(fire_id) {
            escalationContent.innerHTML = '<p style="font-size: 13px; color: #7b6f60;">Loading log...</p>';
            try {
                const { data, error } = await supabase
                    .from('fire_events_archive')
                    .select('data')
                    .eq('id', fire_id)
                    .single();
                    
                if (error || !data) {
                    escalationContent.innerHTML = '<p style="font-size: 13px; color: #7b6f60;">No simulation data yet. Run "Simulate Next Update" to begin tracking.</p>';
                    return;
                }
                
                const record = data.data;
                const level = record.escalation_level_sent || 'Range';
                const log = record.escalation_log || [];
                
                let html = `
                    <div style="margin-bottom: 20px;">
                        <span style="font-size: 12px; text-transform: uppercase;">Current Level:</span><br>
                        <strong style="font-size: 18px; color: #b91c1c;">${level}</strong>
                    </div>
                    <div style="font-size: 13px; font-weight: bold; margin-bottom: 10px;">Escalation History</div>
                `;
                
                if (log.length === 0) {
                    html += `<p style="font-size: 12px; color: #7b6f60;">No escalations triggered yet.</p>`;
                } else {
                    log.forEach(entry => {
                        html += `
                            <div class="log-entry">
                                <div class="log-level">${entry.level}</div>
                                <div class="log-time">${formatTime(entry.timestamp)}</div>
                            </div>
                        `;
                    });
                }
                
                if (record.final_status && record.final_status !== 'active') {
                    html += `
                    <div style="margin-top: 20px; padding: 10px; background: rgba(61,204,115,0.1); border-radius: 4px; text-align: center;">
                        <strong>Resolved:</strong> ${record.final_status}
                    </div>`;
                }
                
                escalationContent.innerHTML = html;
                
            } catch (err) {
                console.error(err);
                escalationContent.innerHTML = '<p style="font-size: 13px; color: var(--red-500);">Failed to load log.</p>';
            }
        }

        function updateActionPanel() {
            if (!selectedAlert) return;
            
            actionPanel.innerHTML = '';
            if (selectedAlert.status === 'pending') {
                actionPanel.innerHTML = `
                    <button class="btn-action btn-confirm" onclick="updateAlertStatus('confirmed', true)">Confirm Fire (GPS)</button>
                    <button class="btn-action btn-false" onclick="updateAlertStatus('false_alarm', false)">False Alarm</button>
                    <button class="btn-action btn-false" onclick="updateAlertStatus('controlled_burn', false)">Controlled Burn</button>
                    <button class="btn-action btn-false" onclick="updateAlertStatus('no_fire', false)">No Fire</button>
                `;
            } else if (selectedAlert.status === 'confirmed') {
                actionPanel.innerHTML = `
                    <div style="width: 100%; text-align: center; margin-bottom: 10px; font-weight: bold; color: #b91c1c;">FIRE CONFIRMED</div>
                    <button class="btn-action btn-simulate" onclick="simulateNextUpdate('${selectedAlert.id}')">Simulate Next Update</button>
                    <div style="width: 100%; border-bottom: 1px solid var(--glass-border); margin: 8px 0;"></div>
                    <button class="btn-action btn-contained" onclick="resolveFire('${selectedAlert.id}', 'Contained')">Mark Contained</button>
                    <button class="btn-action btn-false" onclick="resolveFire('${selectedAlert.id}', 'False Alarm')">False Alarm</button>
                `;
            }
        }

        window.updateAlertStatus = async function(status, includeGps = false) {
            if (!selectedAlert) return;
            mapLoading.style.display = 'flex';
            const updatePayload = { status: status, confirmed_by: currentUser.email, confirmed_at: new Date().toISOString() };
            try {
                if (includeGps) {
                    const pos = await new Promise((res, rej) => navigator.geolocation.getCurrentPosition(res, rej, {enableHighAccuracy: true, timeout: 10000}));
                    updatePayload.confirmed_lat = pos.coords.latitude;
                    updatePayload.confirmed_lng = pos.coords.longitude;
                }
                const { error } = await supabase.from('alerts').update(updatePayload).eq('id', selectedAlert.id);
                if (error) throw error;
                showToast(`Alert marked as: ${status}`, "success");
                loadAlerts(); // Reload will handle UI update
            } catch (err) {
                console.error(err);
                showToast("Failed to update alert", "error");
            } finally {
                mapLoading.style.display = 'none';
            }
        };

        window.simulateNextUpdate = async function(fire_id) {
            mapLoading.style.display = 'flex';
            try {
                const res = await fetch('http://localhost:5001/api/advance_cycle', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ fire_id: fire_id, demo_mode: true })
                });
                const data = await res.json();
                if (data.error) throw new Error(data.error);
                
                showToast(`Cycle ${data.cycle_count} complete: ${data.changes.length} updates.`, "success");
                loadEscalationLog(fire_id);
            } catch (err) {
                console.error(err);
                showToast(err.message, "error");
            } finally {
                mapLoading.style.display = 'none';
            }
        };
        
        window.resolveFire = async function(fire_id, status) {
            if (!confirm(`Are you sure you want to resolve this fire as '${status}'?`)) return;
            mapLoading.style.display = 'flex';
            try {
                const res = await fetch('http://localhost:5001/api/update_status', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ fire_id: fire_id, status: status })
                });
                const data = await res.json();
                if (data.error) throw new Error(data.error);
                
                showToast(`Fire resolved as ${status}.`, "success");
                loadAlerts();
            } catch (err) {
                console.error(err);
                showToast(err.message, "error");
            } finally {
                mapLoading.style.display = 'none';
            }
        };

        async function initialize() {
            try {
                const { data: { session }, error: sessionError } = await supabase.auth.getSession();
                if (sessionError || !session) { window.location.href = '/login.html'; return; }

                currentUser = session.user;
                userEmailDisplay.textContent = currentUser.email;

                const { data: rangerData, error: rangerError } = await supabase
                    .from('rangers')
                    .select('*')
                    .eq('email', currentUser.email)
                    .single();

                if (rangerError || !rangerData) throw new Error("Ranger profile not found.");

                currentRanger = rangerData;
                zoneDisplay.textContent = `Zone: ${currentRanger.zone_id}`;

                initMap();
                await loadAlerts();
                
                // Realtime Subscriptions
                supabase.channel('public:alerts')
                    .on('postgres_changes', { event: '*', schema: 'public', table: 'alerts' }, payload => {
                        console.log('Realtime alert update:', payload);
                        loadAlerts();
                    })
                    .subscribe();
                    
                supabase.channel('public:fire_events_archive')
                    .on('postgres_changes', { event: '*', schema: 'public', table: 'fire_events_archive' }, payload => {
                        console.log('Realtime archive update:', payload);
                        if (selectedAlert && payload.new && payload.new.id === selectedAlert.id) {
                            loadEscalationLog(selectedAlert.id);
                            loadAlerts(); // to refresh confidence badge if changed
                        }
                    })
                    .subscribe();

            } catch (err) {
                console.error(err);
                showToast(err.message, "error");
            }
        }

        logoutBtn.addEventListener('click', async () => {
            await supabase.auth.signOut();
            window.location.href = '/login.html';
        });

        initialize();
    </script>
</body>
</html>
