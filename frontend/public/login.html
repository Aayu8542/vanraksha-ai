<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ranger Login - VanaRaksha AI</title>
    <!-- Use project's global stylesheet -->
    <link rel="stylesheet" href="/src/design-tokens.css" />
    <style>
        body {
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            background-color: var(--bg-paper);
            position: relative;
            margin: 0;
            font-family: var(--font-body);
        }

        body::before {
            content: '';
            position: fixed;
            top: -50%; left: -50%; right: -50%; bottom: -50%;
            background-image: url("data:image/svg+xml,%3Csvg width='400' height='400' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M10 50 Q 150 10 200 100 T 380 150 M 50 150 Q 150 200 250 150 T 390 50 M 100 200 Q 200 150 300 200 T 400 200 M 50 250 Q 150 300 250 250 T 350 250 M 100 300 Q 200 350 300 300 T 400 300 M 150 350 Q 250 300 350 350 T 450 350 M 200 400 Q 300 350 350 400 T 450 450' fill='none' stroke='%23D8D6CB' stroke-width='1' stroke-opacity='0.4'/%3E%3C/svg%3E");
            background-size: 400px 400px;
            z-index: 0;
            pointer-events: none;
            animation: bgDrift 60s linear infinite;
        }
        @media (prefers-reduced-motion: reduce) { body::before { animation: none; } }
        @keyframes bgDrift { from { transform: translate(0, 0); } to { transform: translate(100px, 100px); } }

        .global-header {
            background-color: var(--bg-paper);
            border-bottom: 1px solid var(--border-hairline);
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 1rem 2rem;
            position: relative;
            z-index: 2;
        }
        .logo-lockup { display: flex; align-items: center; gap: 0.75rem; }
        .logo-swatch { width: 24px; height: 24px; background-color: var(--accent-forest); }
        .logo-text { display: flex; flex-direction: column; }
        .logo-name { font-family: var(--font-display); font-weight: bold; font-size: 1.25rem; line-height: 1; color: var(--ink-primary); }
        .logo-tag { font-family: var(--font-body); font-size: 0.65rem; letter-spacing: 0.05em; text-transform: uppercase; color: var(--ink-muted); margin-top: 0.125rem; }

        .main-content {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            z-index: 1;
            padding: 2rem;
        }

        .login-card {
            background-color: var(--bg-paper);
            border: 1px solid var(--border-hairline);
            padding: 2.5rem;
            width: 100%;
            max-width: 420px;
            border-radius: 4px;
            box-sizing: border-box;
        }

        .login-header {
            margin-bottom: 2rem;
        }

        .login-header h1 {
            font-family: var(--font-display);
            font-size: 1.5rem;
            font-weight: 500;
            color: var(--ink-primary);
            margin: 0 0 0.5rem 0;
        }

        .login-header p {
            font-family: var(--font-body);
            font-size: 0.875rem;
            color: var(--ink-muted);
            margin: 0;
        }

        .form-group {
            margin-bottom: 1.5rem;
        }

        .form-group label {
            display: block;
            font-family: var(--font-body);
            font-size: 0.875rem;
            color: var(--ink-primary);
            margin-bottom: 0.5rem;
        }

        .form-group input {
            width: 100%;
            box-sizing: border-box;
            background-color: var(--bg-paper);
            border: 1px solid var(--border-hairline);
            color: var(--ink-primary);
            font-family: var(--font-body);
            font-size: 0.875rem;
            padding: 0.75rem 1rem;
            border-radius: 4px;
            outline: none;
        }

        .form-group input:focus {
            border-color: var(--accent-forest);
        }

        .btn-submit {
            width: 100%;
            background-color: var(--accent-forest);
            color: var(--bg-paper);
            font-family: var(--font-body);
            font-size: 0.875rem;
            font-weight: 500;
            padding: 0.75rem 1.5rem;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            transition: opacity 0.2s;
            margin-top: 0.5rem;
        }

        .btn-submit:hover {
            opacity: 0.9;
        }

        .btn-submit:disabled {
            opacity: 0.7;
            cursor: not-allowed;
        }

        .error-message {
            color: var(--risk-high);
            font-family: var(--font-body);
            font-size: 0.875rem;
            margin-top: 1rem;
            text-align: center;
            display: none;
        }

        .back-link {
            display: inline-block;
            margin-bottom: 1.5rem;
            color: var(--ink-primary);
            text-decoration: none;
            font-size: 0.875rem;
            font-family: var(--font-body);
        }

        .back-link:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>

    <header class="global-header">
        <div class="header-left">
            <div class="logo-lockup" onclick="window.location.href='/'" style="cursor: pointer">
                <div class="logo-swatch"></div>
                <div class="logo-text">
                    <span class="logo-name">VanaRaksha</span>
                    <span class="logo-tag">AI FOREST INTELLIGENCE</span>
                </div>
            </div>
        </div>
        <div class="header-right">
            <a href="/" class="back-link" style="margin: 0;">Back to VanaRaksha</a>
        </div>
    </header>

    <div class="main-content">
        <div class="login-card">
            <div class="login-header">
                <h1>Ranger Login</h1>
                <p>Sign in to view alerts in your zone.</p>
            </div>

            <form id="login-form">
                <div class="form-group">
                    <label for="email">Email</label>
                    <input type="email" id="email" required placeholder="ranger@vanaraksha.in">
                </div>
                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" required placeholder="••••••••">
                </div>
                <button type="submit" id="submit-btn" class="btn-submit">Login to Field Desk</button>
                <div id="error-message" class="error-message"></div>
            </form>
        </div>
    </div>

    <script type="module">
        import { supabase } from './supabaseClient.js';

        const form = document.getElementById('login-form');
        const emailInput = document.getElementById('email');
        const passwordInput = document.getElementById('password');
        const submitBtn = document.getElementById('submit-btn');
        const errorMessage = document.getElementById('error-message');

        async function checkSession() {
            try {
                const { data: { session } } = await supabase.auth.getSession();
                if (session) {
                    window.location.href = '/ranger-dashboard.html';
                }
            } catch (error) {
                console.error("Session check error", error);
            }
        }
        checkSession();

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            
            submitBtn.disabled = true;
            submitBtn.textContent = 'Authenticating...';
            errorMessage.style.display = 'none';

            try {
                const { data, error } = await supabase.auth.signInWithPassword({
                    email: emailInput.value,
                    password: passwordInput.value,
                });

                if (error) throw error;
                
                window.location.href = '/ranger-dashboard.html';
                
            } catch (error) {
                errorMessage.textContent = error.message || 'Login failed. Please check your credentials.';
                errorMessage.style.display = 'block';
                submitBtn.disabled = false;
                submitBtn.textContent = 'Login to Field Desk';
            }
        });
    </script>
</body>
</html>
